motor_control:
  ros__parameters:
    command_topic: cmd_vel
    motor_rpm_topic: motor_rpm_command
    enable_can: false
    can_interface: can0
    can_receive_poll_ms: 50
    feedback_timeout_ms: 500
    reply_timeout_ms: 500
    expect_control_ack: false  # Enable only for firmware that acknowledges every control write
    expected_firmware_identifier: ""  # Optional identity check; does not verify RPM scaling
    odom_frame_id: odom
    base_frame_id: base_link
    left_joint_name: left_wheel_joint
    right_joint_name: right_wheel_joint
    publish_odom_tf: true
    wheel_radius_m: 0.085
    wheel_separation_m: 0.4762
    gear_ratio: 1.0
    max_motor_speed_rpm: 135.0
    rpm_resolution: 1.0  # RPM per CAN unit: 1.0 or 0.1; match controller firmware
    invert_left_motor: false
    invert_right_motor: true
    command_timeout_ms: 500
    control_period_ms: 50

    # Built-in tests run inside motor_control_node. No automatic enable or start.
    motion_test.enabled: true
    motion_test.distance_m: 1.0
    motion_test.angle_deg: 90.0
    # Repetition: straight/rotate = one pair; circle/square/s = one complete shape
    motion_test.repetitions: 3
    motion_test.s_length_m: 4.0  # Travel length of one smooth left/right S
    motion_test.s_radius_m: 1.0  # Minimum nominal curvature radius
    motion_test.s_heading_gain: 1.0  # 1/s; set both gains to 0 for feedforward only
    motion_test.s_lateral_gain: 1.0  # 1/m^2; odometry cross-track correction
    motion_test.circle_radius_m: 1.0
    motion_test.square_side_m: 1.0
    motion_test.clockwise: false  # Circle/square direction; S first turn; false = left
    motion_test.circle_timeout_s: 120.0  # Per circle, including acceleration/deceleration
    motion_test.linear_speed_mps: 0.1
    motion_test.angular_speed_radps: 0.2
    motion_test.linear_accel_mps2: 0.1
    motion_test.angular_accel_radps2: 0.2
    motion_test.distance_tolerance_m: 0.01
    motion_test.angle_tolerance_rad: 0.02
    motion_test.settle_time_s: 0.5
    motion_test.stop_rpm: 0.5
    motion_test.segment_timeout_s: 60.0
    motion_test.stall_timeout_s: 5.0
    motion_test.log_directory: /tmp/motor_control_tests
