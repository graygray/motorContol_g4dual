motor_control:
  ros__parameters:
    command_topic: cmd_vel
    motor_rpm_topic: motor_rpm_command
    enable_can: false
    can_interface: can0
    can_receive_poll_ms: 50
    feedback_timeout_ms: 500
    odom_frame_id: odom
    base_frame_id: base_link
    left_joint_name: left_wheel_joint
    right_joint_name: right_wheel_joint
    publish_odom_tf: true
    wheel_radius_m: 0.085
    wheel_separation_m: 0.4762
    gear_ratio: 1.0
    max_motor_speed_rpm: 135.0
    invert_left_motor: false
    invert_right_motor: true
    command_timeout_ms: 500
    control_period_ms: 50
